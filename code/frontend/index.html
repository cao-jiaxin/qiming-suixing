    '降级原因': photoFallbackReason || '（未降级）',
    '语音播报': TTS_OK,
    '说明': SECURE_CTX
      ? '安全上下文，网页可直接取景'
      : '非安全上下文：网页取景不可用，已自动切换为「系统相机」，功能不受影响。'
        + '如需网页内取景，请用 https 或 localhost 访问。',
  });
}

/* ================================================================
   统一请求
   ================================================================ */
const FETCH_TIMEOUT_MS = 30000;   // 后端单次模型调用上限 20s，再留重试备用模型的余量

/* 等待期的安抚必须**递进**，不能只响一声。
   原来只在第 8 秒说一句"网络有点慢"，之后到 30 秒超时之间是整整 22 秒纯静默 ——
   视障用户在静默里无法区分"正在处理"和"已经卡死"，多数人的反应是杀掉重来，
   而重来意味着再来一次 8 秒的模型调用（三级降级最坏 24 秒）。
   三句话本身也在传递"还在推进"，这比一句"请稍等"有用得多。 */
const SLOW_HINTS = [
  [3000,  '还在处理，请稍等'],
  [9000,  '网络有点慢，还在处理'],
  [18000, '还在等服务器。如果一直没反应，稍后可以轻触屏幕中间重试'],
];

/* 访问口令走请求头而不是 URL 参数：URL 会进浏览器历史、进日志、也会被随手截图。
   抽成一个函数，是因为**不止 post() 一处需要它** ——
   "退出流程"的 DELETE 原来是一句裸 fetch，漏了这个头，
   于是在口令保护的部署版上静默 401：界面显示"流程已退出"，后端会话却还留着。
   这类"只漏了一处"的缺陷不会报任何错，只能靠把构造方式收敛到一处来防。 */
function authHeaders(){
  return accessCode ? { 'X-Access-Code': accessCode } : undefined;
}

async function post(path, form){
  const ac = new AbortController();
  const kill = setTimeout(()=>{ try{ ac.abort(); }catch(e){} }, FETCH_TIMEOUT_MS);
  const slowTimers = SLOW_HINTS.map(([ms, txt])=> setTimeout(()=>speak(txt, false), ms));
  try{
    /* 只有部署版才带得上（本地 accessCode 为空，不带这个头）。 */
    const r = await fetch(API + path, {
      method:'POST', body:form, signal:ac.signal, headers: authHeaders(),
    });
    /* 必须显式检查状态码。后端对空文件返回 400、对超限返回 413，
       这两种响应体里没有 speech/reply，静默往下走会得到一句"没有听清"——
       把"你传错了"伪装成"我没听懂"，归因完全指向错误的方向。
       写 r.ok === false 而不是 !r.ok：测试桩与部分旧环境不提供该字段，
       用 !r.ok 会把"字段缺失"误判成"请求失败"。 */
    if(r.ok === false){
      let detail = '';
      try{ detail = (await r.json()).detail || ''; }catch(e){}
      /* 后端明确拒绝，就不是网络问题。必须把这个区别**带出去**，
         否则下面那层 catch 会统一说成"连接失败，请检查网络"——
         用户于是去查网络，而真正的原因是缺口令或请求太频繁。
         归因错方向比不报错更耗时间。 */
      const err = new Error(detail || ('服务返回 ' + r.status));
      err.backendDetail = detail;
      err.status = r.status;
      throw err;
    }
    const j = await r.json();
    /* 模型名与耗时不再写上屏幕（见 HTML 里那段说明），只进 console。 */
    haptic(HAPTIC_RESULT);                // 结果到达，与"确认执行"的 22ms 区分开
    dbg(j);
    return j;
  }catch(e){
    haptic(HAPTIC_ERR);
    const timedOut = !!(e && e.name === 'AbortError');
    /* 后端明确拒绝（缺口令 / 太频繁 / 文件为空）要说成"它拒绝了这件事"，
       不能说成"连接失败"。这两种描述把用户指向完全不同的排查方向：
       前者要找回口令，后者会去查 WiFi —— 而 WiFi 从头到尾都是好的。 */
    const rejected = !!(e && e.backendDetail);
    const failMsg = rejected
      ? esc(e.backendDetail) + '轻触屏幕中间的结果区可以重试。'
      : timedOut
        ? '处理超时。可能是网络较慢或后端没有响应。轻触屏幕中间的结果区可以重试。'
        : '连接失败：' + ((e && e.message) || e) + '。请检查网络或后端是否启动。轻触屏幕中间的结果区可以重试。';
    setResult('<span class="ph">' + failMsg + '</span>');
    /* 不写 lastSpeech：失败提示不是"结果"。否则用户轻触结果区想重试时，
       反而会听到一遍"连接失败"的回放。 */
    /* 说"屏幕中间的结果区"而不是"这里"：对看不见屏幕的人，"这里"指的是
       他手指现在的位置，而失败时他手指还停在那个按钮上 —— 他会去再按一次按钮，
       然后听到的是"正在处理"之外什么都没发生（其实也重试了，但那条路绕）。
       把位置说成**相对屏幕的固定说法**，他才找得到。 */
    speak(rejected ? e.backendDetail
        : timedOut ? '处理超时，轻触屏幕中间的结果区可以重试'
                   : '连接失败，轻触屏幕中间的结果区可以重试', false);
    throw e;
  }finally{
    clearTimeout(kill); slowTimers.forEach(clearTimeout);
  }
}
const textOf = (j)=> (j.speech || j.reply || '没有听清，请再试一次。');

/* ================================================================
   功能绑定：全部走 bindAccessible（触摸探索 + 震动 + 键盘）
   ================================================================ */

/* ---------- F01–F05 场景理解 ---------- */
bindAccessible($('#btnScene'), '拍照看看周围', async ()=>{
  stopSpeak();
  setResult('<span class="ph">正在拍照识别，请稍等…</span>');
  speak('我看一下，请稍等', false);                 // F15 填充语音
  const shot = await getBlob();
  if(!shot || !shot.blob){ noPhoto(); return; }
  /* 质检没过就到此为止 —— 这一秒的拦截，换掉的是"等 6 秒拿到一段基于糊图的结论" */
  if(!shotPass(shot.quality)) return;
  const fd = new FormData();
  fd.append('image', shot.blob, 'scene.jpg');
  fd.append('query', $('#q').value);
  const j = await post('/api/understand', fd);
  setResult(esc(j.reply));
  setDist(j.distances);                      // F03 把距离表画出来
  speak(textOf(j));
  hintAfterResult(j.distances);
});

/* ---------- F06/F07 文字阅读（按类型分流） ---------- */
let docType = 'auto';
const chipEls = Array.from(document.querySelectorAll('#docChips .chip'));

function selectDocType(chip){
  chipEls.forEach(x=>{
    const on = x === chip;
    x.classList.toggle('on', on);
    x.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  docType = chip.dataset.t;
  /* 选中必须有明确回执。低位视力用户看不出哪一项换了底色，
     全盲用户则连"这次触摸到底生效了没有"都无法确认 ——
     原实现选完一片安静，用户只会以为没按上，然后反复按。 */
  haptic(HAPTIC_TAP);
  speak('已选择' + chip.textContent.trim(), false);
}

/* 文字类型也全部走 bindAccessible：自动获得「滑到就报名字、抬手才选中、
   滑出即取消」的完整探索行为，与所有大按钮保持一致。
   原实现是事件委托 + 只有 touchstart 报名字，不参与 document 级分派 ——
   手指从"药品"滑到"单据票据"时听到的还是"药品"，抬手却选中了"单据票据"。
   这正是大按钮修过的那个坑，但这里漏掉了：两个通道给出矛盾信息，
   对看不见屏幕的用户比"没有反馈"更糟。 */
chipEls.forEach(c=>{
  /* 用逗号而不是冒号：导航播报是「第 N 项：<名字>」，
     名字里再带一个冒号就会出现两个停顿（"第 2 项：文字类型：药品"），
     听觉上像两句话。逗号只停一下。 */
  bindAccessible(c, '文字类型，' + c.textContent.trim(), ()=> selectDocType(c));
});

bindAccessible($('#btnRead'), '拍照读文字', async ()=>{
  stopSpeak();
  setResult('<span class="ph">正在读取文字，请稍等…</span>');
  speak('我看一下，请稍等', false);
  const shot = await getBlob();
  if(!shot || !shot.blob){ noPhoto(); return; }
  if(!shotPass(shot.quality)) return;
  const fd = new FormData();
  fd.append('image', shot.blob, 'text.jpg');
  fd.append('query', $('#q').value);
  fd.append('doc_type', docType);
  const j = await post('/api/read', fd);
  setResult(esc(j.reply));
  setDist([]);
  speak(textOf(j));
  hintAfterResult(j.distances);
});

/* ---------- F09–F12 SOP 流程引导 ---------- */
let sid = null, totalSteps = 0, curIndex = 0;

/* 流程走完之后，只留下「退回上一步」和「退出」。
   为什么不是把整张卡片藏起来：视障用户误判"已到达"最可能发生在**最后一步** ——
   听到"已完成"的那一刻才发现自己认错了地方，而此时按钮全都不见了，
   连"我想退回去"都无从表达。留住纠错入口，比视觉上"干净"重要得多。 */
function setSopControls(finished){
  const n = $('#btnNext'), m = $('#btnManual');
  if(n) n.style.display = finished ? 'none' : '';
  if(m) m.style.display = finished ? 'none' : '';
}

function renderSop(j){
  $('#sopCard').style.display = 'block';
  if(j.flow_title)  $('#sopFlow').textContent = j.flow_title;
  else if(j.flow_id) $('#sopFlow').textContent = j.flow_id === 'sop_transit' ? '乘车引导' : '就医引导';
  totalSteps = j.total_steps || totalSteps;
  curIndex = j.index || curIndex;
  $('#sopStep').textContent = j.finished ? '全部完成' : `第 ${curIndex} 步，共 ${totalSteps} 步`;
  $('#sopBar').style.width = totalSteps ? (curIndex / totalSteps * 100) + '%' : '0';
  setSopControls(!!j.finished);
  /* 完成时"下一步"会被隐藏，焦点可能正停在它上面 —— 立刻把悬空焦点清掉，
     否则用户再按「执行」会触发一个已经不在屏幕上、也不该再执行的动作。 */
  if(j.finished && focusTarget && !navigableTargets().includes(focusTarget)){
    focusTarget = null; refreshRunLabel();

}

/* SOP 推进的共享锁。
   "拍照确认"与"已到达，直接下一步"是两个独立按钮，各自持自己的执行锁 ——
   但它们改的是**同一个**后端会话。用户同时点、或快速交替点两个按钮时，
   两个请求会并发推进同一会话，直接跳步；
   而视障用户看不到进度条，只会听到步骤顺序莫名其妙地错乱。
   所以这把锁必须按会话共享，不能按按钮。 */
let sopPending = false;

async function advance(manual){
  if(!sid){ setResult('<span class="ph">请先说「就医引导」或「乘车引导」。</span>'); speak('请先选择就医引导或乘车引导', false); return; }
  if(sopPending){ haptic(HAPTIC_TOUCH); speak('正在处理，请稍等', false); return; }
  const mySid = sid;                        // 记下本次请求属于哪一个会话
  sopPending = true;
  stopSpeak();
  setResult('<span class="ph">' + (manual ? '按你的确认推进…' : '正在确认是否到达…') + '</span>');
  try{
    const fd = new FormData();
    fd.append('session_id', mySid);
    if(manual){
      fd.append('manual_reached', '1');     // 视觉失效时的人工兜底通道
    }else{
      speak('我确认一下', false);
      const shot = await getBlob();
      if(!shot || !shot.blob){ noPhoto(); return; }
      /* SOP 里的"拍照确认"同样先过质检：拿一张糊图去判断"到没到"，
         模型多半会回 reached=false，用户听到"还没到 XX 的位置"，
         于是继续原地打转 —— 他会以为是自己走错了，而不是照片的问题。 */
      if(!shotPass(shot.quality)) return;
      fd.append('image', shot.blob, 'step.jpg');
    }
    const j = await post('/api/sop/step', fd);
    /* 请求在飞的时候，用户可能已经退出流程、甚至重新开始了另一条流程。
       这一份结果属于上一个会话，必须丢弃 —— 否则它会把刚关掉的 SOP 卡片
       又弹回来，用户会以为"退出根本没生效"。 */
    if(sid !== mySid) return;
    renderSop(j);
    if(j.finished){
      setResult(esc(j.speech)); speak(j.speech);
      /* 刻意**不**把 sid 置空。
         置空是"这一步已经不可挽回了"的隐含声明 —— 但视障用户完全有可能
         在听到"已完成"之后才意识到自己认错了地方（比如把分诊台当成了取号机）。
         保留 sid，「退回上一步」才能把最后一步要回来。 */
    }else{
      setResult(`<div class="stepbar"><span class="badge">第 ${j.index} 步，共 ${j.total_steps} 步</span>`
              + `<span>${esc(j.step.title)}</span></div>${esc(j.speech)}`);
      speak(j.speech);
    }
  }finally{
    sopPending = false;
  }
}

/* ---------- F08 按住说话 ----------
   这个按钮的交互是"按住"，与触摸探索的"抬手执行"相反，
   因此不做 bindAccessible，只补上触碰时的报名字和震动。 */
const vb = $('#btnVoice');
let rec = null, chunks = [], recording = false, recStart = 0, recTick = null;
/* recLimit：录音最长时长的计时器；recMime：这一份录音的真实格式。
   详见下面两个常量的说明。 */
let recLimit = null, recMime = '';

/* 短于此时长视为误触：不做识别，直接告诉用户怎么用。
   在发请求之前拦下，既省一次调用，也避免用户收到一句莫名其妙的
   "没有听清"——那会让他以为是自己说话的问题，而不是手没按稳。 */
const REC_MIN_MS = 400;

/* 录音最长时长。上游的语音识别有 30 秒硬上限（官方限制），
   而"按住不放"这个手势本身也容易被卡住 —— 手抖、走神、被路况打断，
   录音会一直开着。到点自动收尾并**说明原因**，比让用户对着手机
   说上两分钟、最后收到一句"失败"要好得多。留 5 秒余量给转码与上传。 */
const REC_MAX_MS = 25000;

/* ================================================================
   把录到的音频转成 16-bit PCM WAV

   为什么非转不可：语音识别只收 wav / mp3，而 MediaRecorder 在
   Chrome 上录的是 webm/opus、Safari 上是 mp4/aac。
   实测把 webm 原样上传，上游直接 400 / code 1214
   「transcriptions不支持当前文件格式」—— **不转码这条路根本走不通**。
   这才是"按住说话识别不出来"的根因，跟识别精度无关。

   怎么转：不引入任何库，借浏览器自带的解码器 ——
   decodeAudioData 能把 webm/opus 与 mp4/aac 都解成 PCM，
   我们再按 WAV 规格手工写 44 字节头 + PCM 数据。全程不依赖网络。

   采样率保持原样、不做重采样：实测 8k / 16k / 48k 的**同一段语音**
   上传后识别结果完全一致，重采样纯属多余 ——
   而少一段自己写的信号处理代码，就少一类"识别不准"的可能来源。
   ================================================================ */
async function recToWav(blob){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC || !blob || !blob.size) return null;
  let ac = null;
  try{
    ac = new AC();
    /* 每次都重新取 arrayBuffer：decodeAudioData 会**接管并清空**
       传入的那个 ArrayBuffer，复用同一个会直接抛异常。 */
    const buf = await ac.decodeAudioData(await blob.arrayBuffer());
    const chs = buf.numberOfChannels, n = buf.length, rate = buf.sampleRate;
    if(!n || !rate) return null;
    /* 多声道先混成单声道。手机通常是 1 声道，但桌面端常见 2 声道，
       而 WAV 头里我们声明的是 1 声道 —— 不混的话播放速度会变成两倍，
       识别结果全错，而且从现象上完全看不出原因。 */
    const mono = new Float32Array(n);
    for(let c = 0; c < chs; c++){
      const d = buf.getChannelData(c);
      for(let i = 0; i < n; i++) mono[i] += d[i] / chs;
    }
    const out = new ArrayBuffer(44 + n * 2), v = new DataView(out);
    const tag = (off, s)=>{ for(let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
    tag(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); tag(8, 'WAVE');
    tag(12, 'fmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true);              // 1 = PCM（未压缩）
    v.setUint16(22, 1, true);              // 单声道
    v.setUint32(24, rate, true);           // 采样率
    v.setUint32(28, rate * 2, true);       // 字节率 = 采样率 × 块对齐
    v.setUint16(32, 2, true);              // 块对齐 = 声道数 × 位深/8
    v.setUint16(34, 16, true);             // 位深
    tag(36, 'data'); v.setUint32(40, n * 2, true);
    for(let i = 0, o = 44; i < n; i++, o += 2){
      const s = mono[i] < -1 ? -1 : (mono[i] > 1 ? 1 : mono[i]);
      v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return out;
  }catch(e){
    /* 解不出来不是致命错误：返回 null，调用方退回上传原始音频，
       由后端把"格式不支持"翻译成一句准确的人话 —— 比在这里静默失败强。 */
    return null;
  }finally{
    try{ if(ac) ac.close(); }catch(e){}
  }
}

/* ================================================================
   语音直达 —— "按钮按不准"的根本解：让用户根本不需要按按钮

   这是本项目最应该先做好的一条通道。理由很直接：
   对看不见屏幕的人来说，**说话永远比在屏幕上找一个位置更自然、更可靠**。
   只要"按住说话"能直达每一个功能，按钮按不准这件事就不再是阻塞性问题。

   为什么在前端再做一次关键词匹配，而不是只信后端的意图分类：
   免费小模型在嘈杂环境下的意图分类并不稳，而"读一下""去医院"这类词
   一旦被分类错，用户会以为整个功能坏了 —— 他没有任何办法看出是识别错了。
   本地匹配是确定性的：错了能复现、能改、能加测试。

   为什么放在"按住说话"里而不是做唤醒词：
   纯 H5 无法在后台持续监听麦克风（浏览器安全策略），所以"喊一声就响应"
   做不到。诚实地说清楚这一点，比做一个时灵时不灵的唤醒词要好。
   ================================================================ */
const VOICE_ROUTES = [
  /* 顺序要紧：先匹配到的先赢。
     "帮我看看这盒药上写的什么"里同时含"看看"（场景）与"药"（读文字），
     必须让更具体的"读文字"赢，否则用户想读药盒却收到一段环境描述 ——
     这正是用户实测时反馈过的那类困惑。
     同理"再念一遍"里含"念"，重听必须排在读文字之前。 */

  /* ① 停止播报 —— 必须排在最前。
     用户说"别念了"的时候正在播报，如果被后面任何一条规则命中，
     触发的动作会用 speak() 打断当前播报再念新的 —— 听起来像"根本没停"，
     与他的意图正好相反。stopSpeak 不写 lastSpeech，所以重听仍然有效。 */
  { re: /(停止播报|别念了|不要说了|别说了|安静一下|停一下|先别说|不用念了)/,
    name: '停止播报',
    run: ()=>{ stopSpeak(); haptic(HAPTIC_CANCEL); } },

  { re: /(重听|再说一遍|再念一遍|刚才说什么|没听清|重复一遍|再报一遍)/,
    name: '重听上一次播报',
    run: ()=>{ if(lastSpeech) speak(lastSpeech); else speak('现在还没有可以重听的内容', false); } },
  /* 距离表：方位在「注意」段里是一句连读的口语，用户容易只记住最后一条。
     距离表把它变成**结构化复读**（"共 3 条：12点 6步，1点 6步，11点 15步"），
     而且屏幕上那些 <b> 本身摸不到、也读不出，全盲用户只能靠这条语音直达。
     用户说一句就能逐条听清，不必先摸到距离表再抬手指。 */
  { re: /(距离表|方位表|几个方向|几个方位|全部方向|全部方位|还有哪|另外的方向)/,
    name: '听全部距离方位',

  { re: /(药盒|药品|吃药|服药|说明书|剂量|用法用量|这盒药|这瓶药)/,

  { re: /(指示牌|牌子|门牌|路牌|标牌|招牌|导览)/,

    name: '读文字，价签', run: ()=>{ pickDocType('price'); runPick('#btnRead'); } },
  { re: /(单据|票据|发票|收据|化验单|检查报告|报告单)/,
    name: '读文字，单据票据', run: ()=>{ pickDocType('doc'); runPick('#btnRead'); } },

  /* 退回上一步：视障用户判断"到了没有"只能靠听，误判概率远高于明眼用户。
     给它一条不按键的纠错通道，比要求用户去屏幕里找一个按钮现实得多。 */
  { re: /(退回去|退回上一步|退回|上一步|退一步|返回上一步|弄错了|判错了)/,
    pick: '#btnBack', name: '退回上一步' },
  { re: /(就医|医院|挂号|看病|诊室|取药|门诊)/,           pick: '#btnSopMedical', name: '就医引导' },
  { re: /(乘车|公交|地铁|坐车|大巴|班车|站台)/,           pick: '#btnSopTransit', name: '乘车引导' },
  /* 求助的口语说法比书面说法多得多。原规则只有"帮忙/求助/人工/志愿者"，
     于是"帮我叫个人""我想找人"这两句**最自然**的求助话全部落空 ——
     而它们出现在用户最着急的时刻，落空的代价也最大。

     中间会被一个字断开，写死"叫人"照样漏。所以按短语前缀收。

  /* "下一步"必须排在"下一个功能"之前 —— 否则含"下一个"的那条会先把它吃掉，
     用户说"下一步"结果只是移动了焦点，SOP 一动不动。 */
  { re: /(下一步|好了|到了|完成|继续|到没有|到了吗)/,      pick: '#btnManual',     name: '已到达，直接下一步' },

  { re: /(周围|前面|前方|环境|有什么|障碍|路况|看看|看一下|拍照|这是什么)/,
                                                          pick: '#btnScene',      name: '拍照看看周围' },

  /* ③ 播报本身的设置。视障用户对语速与音色的需求差异极大（有人嫌快、
     有人嫌慢、有人听男声更清楚），而这几个按钮藏在设置卡片里 ——
     要说"慢一点"的时候，正是他听不清、没法在屏幕上找按钮的时候。 */
  { re: /(慢一点|说慢点|慢点儿|太快了|听不过来)/,           pick: '#btnSlower',    name: '说得慢一点' },
  { re: /(快一点|说快点|快点儿|太慢了)/,                    pick: '#btnFaster',    name: '说得快一点' },
  /* ④ 顺序导航本身。说"下一个功能"比摸黑找屏幕底部那三个键可靠。
     放在最后：它们最泛，让所有具体功能先匹配。 */
  { re: /(上一个功能|前一个功能|上一个|前一个)/,            pick: '#btnPrev',      name: '上一个功能' },
  { re: /(下一个功能|后一个功能|下一个|后一个)/,            pick: '#btnNextItem',  name: '下一个功能' },
];

/* 没匹配上时不能装死。用户说了话却没反应，会以为语音功能坏了；
   这里直接把"可以说什么"报出来，等于把菜单念给用户听。 */
const VOICE_MENU = '可以说：看看周围、读一下文字、读这盒药、去医院、坐公交、'
                 + '下一步、退回上一步、距离表、重听一遍、慢一点、别念了、退出。'
                 + '也可以直接用手指在屏幕上找按钮。';

/* 把读文字的类型选中。复用页面自己的 selectDocType，
   这样视觉高亮、aria-pressed、震动回执与手指点击完全一致 ——
   语音与触摸只是两条入口，落到同一条实现上，行为就不可能分家。 */
function pickDocType(t){
  const chip = chipEls.filter(c=>c.dataset.t === t)[0];
  if(chip) selectDocType(chip);
}

/* 语音里"先选类型、再执行"的两步动作。
   必须等类型播报念完再点执行：speak() 的第一步是 cancel()，
   而 btnRead 的处理函数开头就会 speak('我看一下，请稍等') ——
   立刻点下去的话，"已选择药品"会被当场掐断，用户永远听不到
   自己设的类型到底生效了没有。 */
function runPick(sel){
  afterSpeech(()=>{ const el = $(sel); if(el) el.click(); }, 4000);
}

function findVoiceRoute(text){
  const t = String(text || '');
  if(!t) return null;
  for(const r of VOICE_ROUTES) if(r.re.test(t)) return r;
  return null;
}

function runVoiceRoute(r){
  /* 有些语音意图没有对应的按钮（比如"重听"），直接在路由里带一个 run。
     有按钮的一律走 click —— click 会经过 bindAccessible 的统一入口。 */
  if(typeof r.run === 'function'){ r.run(); return true; }
  const el = $(r.pick);
  if(!el) return false;
  /* 走 click 而不是直接调动作函数：click 会经过 bindAccessible 的统一入口，
     于是防重复提交、执行锁、二次确认这些保护一个都不会绕过。
     （"呼叫人工志愿者"仍然需要二次确认 —— 语音识别本来就可能听错，
       让它一句话就把求助发出去，风险比多点一下大得多。） */
  el.click();
  return true;
}

/* 等一句话念完再继续（最多等 maxMs）。
   为什么需要：speak() 内部第一步就是 cancel()，所以"复述确认"之后若立刻
   触发动作，那句"你说的是××"会被自己的下一步当场掐断 ——
   而这句话正是用户在嘈杂环境里发现"识别错了"的唯一机会。
   宁可晚半秒执行，也不能让用户失去这个纠错窗口。 */
function afterSpeech(fn, maxMs){
  if(!TTS_OK || !speaking){ setTimeout(fn, 120); return; }
  const t0 = Date.now();
  const timer = setInterval(()=>{
    if(!speaking || Date.now() - t0 > (maxMs || 6000)){ clearInterval(timer); fn(); }
  }, 120);
}

/* 把录音送去识别。
 *
 * 为什么独立成一个函数，而不是继续写在 rec.onstop 里：
 * 原来 post('/api/asr') 失败时被 `catch(e){ /* post 内已提示 *\/ }` 吞掉，
 * 而结果区同时写着"轻触这里可以重试" —— 轻触却没有任何反应。
 * 那是全站唯一一条"承诺了却不兑现"的路径，对全盲用户就是彻底迷路。
 * 现在失败时把"重发同一段音频"注册为 pendingRetry，轻触结果区真的会重发
 * （重发比"重新录一遍"更合理：失败多半是网络抖动，音频本身还在）。
 */
async function sendAudio(fd){
  try{
    const j = await post('/api/asr', fd);
    /* 后端没有听写引擎时（未装 FunASR），必须说清"这里没有这个能力"，
       而不是"没有听清" —— 后者会让用户反复重说，方向完全错。
       这不是假想情形：部署环境当前就处于这个状态（见 /api/meta 的 asr.available）。 */
    if(j.asr_available === false){
      $('#q').value = '';
      setResult('<span class="ph">这台服务器当前没有语音识别引擎，'
              + '请改用下方输入框打字，或直接点「拍照看看周围」。</span>');
      haptic(HAPTIC_ERR);
      speak('这里暂时不能听写，请用下面的按钮或输入框', false);
      return;
    }
    $('#q').value = j.text || '';
    const it = (j.intent && j.intent.intent) || '-';
    const route = findVoiceRoute(j.text);
    setResult('识别结果：' + esc(j.text || '（空）') + '\n意图：' + esc(it));
    /* 复述确认：视障用户常在嘈杂环境，识别错了直接执行比不执行更危险。
       先说完这句，再执行 —— 见 afterSpeech 的说明。
       必须 remember:false —— 这句是**交互提示**不是"内容"。
       写进 lastSpeech 的后果很隐蔽：用户接着说"再说一遍"，
       重播的会是"你说的是：再说一遍"这句复述本身，
       而不是他真正想再听一遍的那条识别结果。 */
    speak(j.text ? ('你说的是：' + j.text) : '没有听清，请再说一次', false);
    afterSpeech(()=>{
      /* 语音直达优先走本地关键词（确定性）；本地没匹配上再退回后端意图分类；
         两条都走不通就把"可以说什么"的菜单念出来，绝不装死。 */
      if(route){ runVoiceRoute(route); return; }
      if(!j.text) return;
      if(it === 'sop_medical') startSop('sop_medical');
      else if(it === 'sop_transit') startSop('sop_transit');
      else if(it === 'help_human') $('#btnHelp').click();
      else speak(VOICE_MENU, false);
    });
  }catch(e){
    /* post() 已经把失败原因（人话）写进结果区了，这里只负责补上重试通道。
       用箭头函数包一层而不是直接传 sendAudio：pendingRetry 是无参调用。 */
    pendingRetry = ()=>sendAudio(fd);
  }
}

async function startRec(){
  if(recording) return;
  stopSpeak();
  /* 认领预申请的那一份麦克风（见 vbArmRec 的说明）。
     必须**立刻**把它从 vbMicP 摘下来：松手时 vbStopHold 会调 dropVBStream
     关掉"还挂在 vbMicP 上没被用掉的那一份"，而我们正要拿它去录音 ——
     摘了之后那个清理逻辑就碰不到它了。 */
  const pre = vbMicP; vbMicP = null;
  if(!window.MediaRecorder || !navigator.mediaDevices){
    releaseMic(await pre);
    setResult('<span class="ph">当前浏览器不支持录音（非 HTTPS 地址或微信内置浏览器常见）。'
            + '请在下方输入框直接打字，再点「拍照看看周围」。</span>');
    haptic(HAPTIC_ERR); speak('当前浏览器不能录音，请用输入框打字', false);
    return;
  }
  let s = null;
  try{
    const r = await (pre || requestMic());
    if(r && r.ok) s = r.stream;
  }catch(e){ s = null; }
  if(!s){
    /* 拒绝授权 / 麦克风被别的应用占用：必须说出来。
       原实现用的是 .then() 且没有 .catch —— 用户点了"拒绝"之后，
       按钮文字已经变成"松开结束"，却什么都没发生，也没有任何提示。
       对看不见屏幕的用户，"按了没反应"是最糟糕的失败模式。 */
    haptic(HAPTIC_ERR);
    setResult('<span class="ph">没有拿到麦克风权限。请在浏览器里允许使用麦克风后重试，'
            + '或改用下方输入框打字。</span>');
    speak('没有拿到麦克风权限，可以改用输入框打字', false);
    return;
  }
  /* 明确挑一个录制格式，而不是让浏览器随便选。
     不指定的话 Safari 给 mp4/aac、Chrome 给 webm/opus，我们后面都会转码，
     但知道**原格式**才能在转码失败时给后端一个准确的扩展名 ——
     否则它只能凭魔数猜，而猜错就会把"格式问题"报成"没听清"。 */
  const CAND = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
  let mt = '';
  for(const c of CAND){
    try{
      if(window.MediaRecorder.isTypeSupported && window.MediaRecorder.isTypeSupported(c)){ mt = c; break; }
    }catch(e){}
  }
  rec = mt ? new MediaRecorder(s, {mimeType: mt}) : new MediaRecorder(s);
  recMime = rec.mimeType || mt || '';
  chunks = [];
  rec.ondataavailable = e=>chunks.push(e.data);
  rec.onstop = async ()=>{
    s.getTracks().forEach(t=>t.stop());
    const raw = new Blob(chunks,{type: recMime || 'audio/webm'});
    /* 双重拦截：时长过短，或数据量小到承载不了一句话。
       只按时长判会漏掉常见情形 —— 触摸探索时手指在按钮上停留超过
       400ms 是常事，松手后就会把一个空音频送去识别，用户得到的
       回答是"没有听清"，而真正的原因是他根本没打算说话。 */
    if(Date.now() - recStart < REC_MIN_MS || raw.size < 1500){
      haptic(HAPTIC_ERR);
      speak('没有开始录音。请按住按钮不放，说完再松开', false);
      return;
    }
    /* 松手到结果回来之间有一段空档（转码 + 识别 + 网络）。对看不见屏幕的
       用户，这段时间毫无反馈的话，他会怀疑"是不是我没松开""它听到没有"，
       最常见的反应是把整句话再说一遍 —— 识别结果里就多了一串重复内容。
       所以这里先把状态写在结果区（也顺带滚到可见）。 */
    setResult('<span class="ph">正在识别刚才的话…</span>');
    const wav = await recToWav(raw);
    const fd = new FormData();
    /* 转码成功传 wav；失败则原样传，让后端把"格式不支持"换成一句
       准确的人话，而不是让用户以为是自己没说清。 */
    if(wav){
      fd.append('audio', new Blob([wav], {type:'audio/wav'}), 'a.wav');
    }else{
      fd.append('audio', raw, /mp4/.test(recMime) ? 'a.mp4' : 'a.webm');
    }
    await sendAudio(fd);
  };
  rec.start(); recording = true; recStart = Date.now();
  /* 录音期间每 2.5 秒一次心跳震动：这是"还在录"唯一的持续反馈。
     不能说语音（会被自己的麦克风录进去），也不能靠屏幕（用户看不见）。
     没有它的话，一旦录音轨被系统静默中断（来电、其他应用抢占麦克风），
     用户会一直举着手机说完，最后收到一句"没有听清"——而原因根本不是他没说清。 */
  clearInterval(recTick);
  recTick = setInterval(()=>haptic(HAPTIC_REC_TICK), 2500);
  /* 到点自动收尾。见 REC_MAX_MS 的说明：按住不放很容易被卡住，
     而超过 30 秒上游会直接拒收。 */
  clearTimeout(recLimit);
  recLimit = setTimeout(()=>{
    if(!recording) return;
    haptic(HAPTIC_CANCEL);
    speak('已经录满 25 秒，我现在开始识别', false);
    endRec();
  }, REC_MAX_MS);
  /* 用双短震而不是语音提示"开始录音"：原实现会在触摸时播报
     "按住说话，松开结束"，而录音已经同时开始 —— 这句自己的 TTS
     被录进了麦克风，识别结果里混着机器音。震动不经过麦克风，是干净通道。 */
  haptic(HAPTIC_REC);
  vb.textContent = '松开结束'; vb.classList.remove('sec'); vb.classList.add('warn');
  setResult('<span class="ph">正在录音…松开手指结束。</span>');
}

function endRec(){
  if(rec && recording){
    recording = false;
    try{ rec.stop(); }catch(e){}
    clearInterval(recTick); recTick = null;
    clearTimeout(recLimit); recLimit = null;
    vb.textContent = '按住说话'; vb.classList.add('sec'); vb.classList.remove('warn');
    /* 松开必须有回执。识别要等一两秒，中间若毫无反馈，用户会怀疑
       "我是不是没松开""它是不是没听见"，最常见的反应是把整句话再说一遍，
       于是识别结果里出现一串重复内容。 */
    speak('录音结束，正在识别', false);
  }
}

/* ================================================================
   按住说话：先报名字，念完再开麦

   原来这里有一条"保护性"的设计：按下即开始录音，所以**不敢播报**
   （任何语音都会被自己的麦克风录进去），改成只震动 + 高亮。
   保护本身是对的，但代价被低估了 —— 不播报意味着这个按钮
   在触摸探索里等于不存在：用户摸到它，命中的是"空白区域"分支，
   听到"这里是空白"；顺序导航里也没有它（压根没注册）。
   而它偏偏是整个应用**最重要的输入通道**（见 VOICE_ROUTES 的说明）。

   真正的矛盾是"按下即开麦"这个时机太早，而不是"不该播报"。所以：
     按住（pointerdown）→ 先报名字（约 1 秒）→ 名字念完的那一刻才开麦。
   两个目标就都不冲突了：
     · 用户听见"按住说话"，知道自己找对了地方（探索需求满足）；
     · 自己的提示音在开麦之前就结束了，不会混进音频（原来那个老问题也解决了）；
     · 等待期正好被播报填满，用户不会觉得"按了没反应"。
   开麦时给一声双短震（HAPTIC_REC）—— 震动不经过麦克风，是干净通道，
   用户能明确感知"现在开始说"。

   兜底 1500ms：TTS 万一卡住不结束，也不能让录音永远开不起来。
   ================================================================ */
let vbHold = false, vbArmTimer = null, vbHoldStart = 0;

/* "轻点"的长度上限。低于它的按下一律当成"点一下看看这是什么"，
   不录音 —— 否则用户每次轻点「执行」都会录进一段无意义音频。 */
const VB_TAP_MAX_MS = 300;

/* ================================================================
   开麦时机：从"等播报念完"改成"固定上限 + 主动掐断"

   原实现是"名字念完才开麦"（判据 `!speaking`），初衷是避免自己的 TTS
   被麦克风录进去。这个顾虑是真的，但代价被低估了：
   「按住说话」四个字要念 1.1~1.3 秒，而用户的肌肉记忆是**按下就说**
   （微信、所有语音输入都是这样）。说"帮我看看这是什么"，
   前 1 秒被切掉，识别出来是"是什么" —— 而用户只会得出"识别不准"的结论，
   根本不会想到是自己按早了。这是全站最重要的输入通道，丢 1 秒等于不能用。

   1 秒的话被丢掉是致命的，0.4 秒的机器音只是噪声 —— 两者代价不对等。
   所以：判定为"按住"（>VB_TAP_MAX_MS）之后再等 VB_OPEN_MS 就开麦，
   **不管播报有没有念完**，开麦时由 startRec() 里的 stopSpeak() 把它掐断。
   用户实际听到的是前半句"按住"—— 恰好是这个控件最关键的动作词。
   （顺序导航选中它时不受影响：那里不录音，会完整念出"按住说话"。）

   顺手把麦克风申请提前：getUserMedia 要 100~400ms（授权、音频栈启动），
   原来这段时间全额加在"按下 → 真正开始录"上。现在一判定为"按住"就并行发出请求，
   等 VB_OPEN_MS 到点时多数设备已经就绪 —— 丢的那 0.4 秒不再叠加启动耗时。
   ================================================================ */
const VB_OPEN_MS = 380;

/* 预申请的麦克风。resolve 成 {ok, stream} / {ok:false, error}，**永不 reject** ——
   否则用户在"还没开麦"时松手，会留下一个没人处理的 rejection。 */
let vbMicP = null;

function requestMic(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      return Promise.resolve({ ok:false, error:new Error('no getUserMedia') });
    return navigator.mediaDevices.getUserMedia({audio:true}).then(
      (s)=>({ ok:true, stream:s }),
      (e)=>({ ok:false, error:e })
    );
  }catch(e){ return Promise.resolve({ ok:false, error:e }); }
}
function prewarmMic(){
  if(!vbMicP) vbMicP = requestMic();
  return vbMicP;
}
/* 关掉一份已申请到、但没人用的流。开着不关的话手机上会一直亮录音指示。 */
function releaseMic(r){
  if(!r) return;
  Promise.resolve(r).then((x)=>{
    if(x && x.ok && x.stream) try{ x.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  }).catch(()=>{});
}
/* 松手时若预申请到的流还没被录音认领，关掉它。 */
function dropVBStream(){
  if(!vbMicP) return;
  const p = vbMicP; vbMicP = null;
  releaseMic(p);
}

function vbBeginHold(){
  vbHold = true; vbHoldStart = Date.now(); vbArmRec();
}

function vbStopHold(){
  vbHold = false;
  if(vbArmTimer){ clearInterval(vbArmTimer); vbArmTimer = null; }
  /* recording 为假 = 这一份预申请还没被 startRec 认领，得我们自己关。
     正在录的那一份由 rec.onstop 负责停轨，不能在这里动。 */
  if(!recording) dropVBStream();
}

function vbArmRec(){
  if(vbArmTimer || recording) return;
  const t0 = Date.now();
  vbArmTimer = setInterval(()=>{
    /* 中途松手 = 只是想摸一下听听名字，不是要说话。不录音，也不报错。 */
    if(!vbHold){ clearInterval(vbArmTimer); vbArmTimer = null; dropVBStream(); return; }
    /* 前 300ms 不检查：那正是"轻点"的长度。 */
    if(Date.now() - t0 < VB_TAP_MAX_MS) return;
    /* 已确定是"按住"：立刻并行申请麦克风，把授权/启动耗时藏进等待窗口 */
    prewarmMic();
    if(Date.now() - t0 >= VB_OPEN_MS){
      clearInterval(vbArmTimer); vbArmTimer = null;
      if(vbHold) startRec();
    }
  }, 60);
}

/* 触摸反馈只给震动与高亮（此时还没开麦，但名字由触摸探索统一播报，
   不在这里重复念一遍）。 */
vb.addEventListener('touchstart', ()=>{
  haptic(HAPTIC_TOUCH); vb.classList.add('focusring');
}, {passive:true});
vb.addEventListener('touchend', ()=> vb.classList.remove('focusring'), {passive:true});

vb.addEventListener('pointerdown', vbBeginHold);
/* 结束监听挂在 window 而不是按钮自身：
   鼠标拖出按钮再松开时，pointerup 的目标是按钮之外的元素 ——
   挂在按钮上就会漏掉，recording 永久卡在 true，
   而 startRec 开头正好有 if(recording) return：用户从此再也录不了音，
   界面上看起来却只是"识别不出来"。endRec 自带幂等判断，重复调用安全。 */
window.addEventListener('pointerup', ()=>{ vbStopHold(); endRec(); });
window.addEventListener('pointercancel', ()=>{ vbStopHold(); endRec(); });   // 来电、系统手势打断

/* 注册进触摸探索，并且**要进顺序导航**（见 bindAnnounceOnly 的 opts.nav）。
   按住说话是这个应用最重要的输入通道，不能只靠"在整页里摸到它"。 */
bindAnnounceOnly($('#btnVoice'), '按住说话', ()=>{}, { nav: true });

/* ================================================================
   顺序导航的项序 = 页面的从上到下顺序

   这里**故意什么都没有**，因为顺序不需要维护：
   navigableTargets() 直接按 DOM 文档顺序排（见 domOrder）。

   为什么最终选了"照抄版式"，而不是按使用频率重排：
   ① 用户在页面上看到的顺序，和他听到的顺序必须是同一个。
      两者不一致时，低视力用户按「下一个」会看到选中框在页面上下乱窜，
      全盲用户则完全没法用"我手指摸到哪儿了"来校准"现在这是第几项"——
      而这个校准能力恰恰是顺序导航存在的意义。
   ② 曾经用一张手写的 NAV_ORDER 表按"频率 + 紧急度"重排：把「拍照看看周围」
      放第 1、「呼叫人工志愿者」放第 2。副作用是每改一次页面就得同步改表，
      忘了改就静默错序 —— 这类"两处真理"的设计迟早会腐烂。
   ③ 紧急项的可达性因此改为由底栏「执行」键的**长按**承担（见 lpBegin）：
      无论焦点停在哪一项，长按 1.5 秒都直接呼叫志愿者。
      这比"排在第 2 位"更可靠 —— 它根本不依赖用户按对多少次「下一个」。
   ================================================================ */

/* ================================================================
   消灭"摸到却不知道是什么"的区域

   这条是承接"按钮能不能被精确按到"的同一类问题：按不准的另一面是
   **摸到了却得不到解释**。用户摸到分组标题、补充说明输入框、SOP 进度条时，
   原来都会走到空白提示，被统一告知"这里是空白区域"——
   而对用户来说它明明有字、有框，这个回答等于说"我也看不懂"。
   这类"信息性区域"统一注册成"只报名字不执行"，摸到就说明它的用途。
   ================================================================ */
document.querySelectorAll('.sec-title').forEach(el=>{
  bindAnnounceOnly(el, el.textContent.trim() + '。这是一组功能的标题，下面的按钮都属于这一组');
});

/* 补充说明输入框：它原来是整页唯一"摸到没反应"的输入控件。
   全盲用户主要靠"按住说话"，但打字这条路不能被藏起来 ——
   尤其在嘈杂环境（路边、地铁）语音识别很差时，打字是唯一可靠通道。 */
bindAnnounceOnly($('#q'), ()=>{
  const base = '补充说明输入框，可以不填。'
             + '摸到它之后可以用系统键盘打字，例如"挂号窗口在哪"。'
             + '也可以按住下面的「按住说话」用语音说';
  return $('#q').value ? base + '。当前已经写了：' + $('#q').value : base;
}, ()=>{ speak('补充说明输入框。' + ($('#q').value ? '当前写着：' + $('#q').value : '现在是空的，可以不填'), false); });

/* SOP 进度条：摸到它应当重新念一遍**当前**步骤，而不是念"第 1 步".
   （名字用函数现算 —— 写死的进度是错误信息，比不报更糟。） */
bindAnnounceOnly($('#sopStep'), ()=>{
  if(!sid || !totalSteps) return '流程进度。当前没有进行中的流程';
  return `流程进度：第 ${curIndex} 步，共 ${totalSteps} 步。轻触可以重听这一步要做什么`;
}, ()=>{
  if(!sid || !totalSteps){ speak('当前没有进行中的流程', false); return; }
  if(lastSpeech) speak(lastSpeech);
  else speak(`第 ${curIndex} 步，共 ${totalSteps} 步`, false);
});

/* ================================================================
   播报设置：把"选声音"的权力交回用户

   自动挑「最温柔的那个」是个猜测。温柔与否很主观，更要紧的是
   各设备装的语音差别极大 —— 某些手机上只有一个很生硬的合成音。
   自动挑的不合意时，用户不会认为"我的设备语音不好"，
   只会认为"这个应用的播报就是这么难听"，然后就放弃了。
   而语音播报是视障用户**唯一的输出通道**，放弃它等于放弃整个应用。
   所以给他三个按钮：能试、能换、能调速。
   ================================================================ */
function shortVoiceName(v){
  if(!v) return '系统默认声音';
  let n = String(v.name || v.voiceURI || '');
  n = n.replace(/^Microsoft\s+/i, '')
       .replace(/\s*[-–]\s*Chinese.*$/i, '')
       .replace(/\s*\([^)]*\)\s*/g, ' ')
       .replace(/\s+/g, ' ')
       .trim();
  return n || '系统默认声音';
}

function refreshSpkInfo(){
  const el = $('#spkInfo');
  if(!el) return;
  const list = softVoices();
  let msg;
  if(!TTS_OK){
    msg = '当前浏览器不支持语音播报。请改用 Chrome、Safari 或 Edge 打开。';
  }else if(!list.length){
    /* voicesLoaded=false 与"这台设备真没装中文语音"是两件事，
       但用户能做的动作不同：前者等一下就好，后者要去系统设置里装。 */
    msg = voicesLoaded
        ? '这台设备上没找到中文语音，只能使用系统默认的发音。'
        : '正在读取可用声音，稍等一下再试。';
  }else{
    /* 不再报"第几个、共几个可选"。那串数字是给「换个声音」按钮当坐标用的，
       按钮按用户要求撤掉之后，它就成了用户**拿不到也用不上**的信息：
       他听得到"第 2 个，共 6 个"，却没有任何办法走到第 3 个。
       现在只说他能实际改动的两件事：用的是哪个声音、语速多少。 */
    msg = '正在使用：' + shortVoiceName(zhVoice)
        + '，语速 ' + speechPref.rate.toFixed(2);
  }
  el.textContent = msg;
}

/* 试听句刻意是完整的短句而不是"嘟"一声：
   要听出"温柔不温柔、快慢合不合适"，必须有正常的语调起伏和停顿。
   这句同时也是真实场景里的口气 —— 用户听到的就是以后每天听到的。 */
const VOICE_TRIAL = '你好，我是启明随行。这样听起来舒服吗？';

function bindVoiceSettings(){
  const nudgeRate = (delta)=>{
    const next = Math.round((speechPref.rate + delta) * 100) / 100;
    if(next < 0.75 || next > 1.35){
      haptic(HAPTIC_ERR);
      speak(delta < 0 ? '已经是最慢的了' : '已经是最快的了', false);
      return;
    }
    speechPref.rate = next;
    saveSpeechPref();
    haptic(HAPTIC_TAP);
    refreshSpkInfo();
    /* 试听句里直接带上数字：用户下次想知道"现在多快"时，
       摸到这个按钮就能听到，不必去别处找。 */
    speak('现在是 ' + next.toFixed(2) + ' 倍速。' + VOICE_TRIAL, false);
  };

  bindAccessible($('#btnSlower'),    '说得慢一点', ()=> nudgeRate(-0.05));
  bindAccessible($('#btnFaster'),    '说得快一点', ()=> nudgeRate(+0.05));
  refreshSpkInfo();
  /* voiceschanged 可能在 bindVoiceSettings 之后才到（Android 上必然如此），
     到了要刷新一次显示，否则"正在使用"永远是初始那行字。 */
  if(TTS_OK){
    const prev = speechSynthesis.onvoiceschanged;
    try{
      speechSynthesis.onvoiceschanged = ()=>{ try{ if(prev) prev(); }catch(e){} refreshSpkInfo(); };
    }catch(e){}
  }
}
bindVoiceSettings();

/* ================================================================
   底栏实测高度 → CSS 变量 --dock-h

   底栏是 fixed 的，它的高度决定两件事：
     ① 页面底部要留多少白（否则最后一排按钮被它永久压住）；
     ② 跟屏区最多能长多高（否则结果的下半截正好被它遮住 —— 真机实测
        就是这样：正文只露出一行，其余全在底栏后面）。
   两处都读同一个变量，就不会各改各的、悄悄跑偏。
   **实测而不是写死**：系统字号、安全区（刘海 / 手势条）、将来再加一个键，
   都会让这个数字变，而写死的数字不会 —— 它只会安静地错下去。
   ================================================================ */
function syncDockH(){
  const d = document.getElementById('dock');
  if(!d) return;
  const h = Math.round(d.getBoundingClientRect().height);
  if(h > 0) document.documentElement.style.setProperty('--dock-h', h + 'px');
}
syncDockH();
window.addEventListener('resize', syncDockH);
window.addEventListener('orientationchange', syncDockH);
/* 字体加载完底栏可能变高（字体回退在移动端很常见），再量一次。 */
if(document.fonts && document.fonts.ready){
  try{ document.fonts.ready.then(syncDockH).catch(()=>{}); }catch(e){}
}

/* 这里原本有一次 applyNavOrder()：给每个可导航项写一个 order 号。
   现在顺序直接取自 DOM（见 navigableTargets / domOrder），
   所以不需要在启动时预计算任何东西 —— 新增按钮自动排在它该在的位置。 */

/* 摄像头不再在页面加载时就打开 —— 改到闸门触摸后申请，
   既蹭到了用户手势，也避免"页面一进来就黑屏开摄像头"的突兀感。 */

/* ================================================================
   演示模式探测（防"看起来正常"的静默降级）

   背景：后端只要没有视觉模型 Key（未建 .env / ZHIPU_API_KEY 为空），
   所有"识别"都会返回系统内置示例，接口不报错、状态码 200、耗时也正常。
   结果是"拍照读文字"返回一段"这是室内走廊"的场景示例，
   用户完全没有线索知道问题出在"没有 Key"，只能到处怀疑功能写错了。

   这里主动问一次 /api/meta，把 mock 状态变成界面上一条明确的横幅。
   mock_mode 的语义已在后端修正为"实际是否 mock"——之前它直读环境变量，
   缺 Key 时会谎报 false。
   ================================================================ */
let DEMO_MODE = false;

/* 横幅要同时回答两个问题：为什么是示例 + 怎么才能用上真模型。
   只写"原因"的话用户仍然不知道下一步该干什么——
   这正是用户实测时反馈的："我怎么样才能用真实的模型"。 */
const DEMO_HOWTO = '在电脑上运行 code/backend/check_model.cmd（或 python check_model.py --set-key），'
                 + '按提示填入免费 API Key 后重启服务。';

function showDemoBar(reason){
  DEMO_MODE = true;
  const bar = $('#demoBar');
  if(!bar) return;
  bar.style.display = 'block';
  bar.innerHTML = '<b>演示模式：以下内容是系统内置示例，不是真实识别结果</b>'
                + '<span>原因：' + esc(reason || '未接入识别模型') + '</span>'
                + '<span>解决：' + esc(DEMO_HOWTO) + '</span>';
  /* 全盲用户也必须有途径知道这件事：横幅进触摸探索，摸到就念完整说明。 */
  bindAccessible(bar,
    '演示模式提示。当前未接入识别模型，屏幕上的内容是系统内置示例，不是真实识别结果。'
    + '原因：' + (reason || '未接入识别模型') + '。解决：' + DEMO_HOWTO, ()=>{}, {nav:false});
}

(async function detectDemoMode(){
  try{
    const r = await fetch(API + '/api/meta');
    const j = await r.json();
    const m = (j && j.models) || {};
    if(m.mock_mode === true) showDemoBar(m.mock_reason);
  }catch(e){
    /* 拿不到就当真实模式：探测失败不该给用户制造恐慌 */
  }
})();
</script>
</body>
</html>
